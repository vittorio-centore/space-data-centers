[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
filterwarnings = ignore::DeprecationWarning
markers =
    unit: Isolated domain tests (orbits, planner, quotas, parser)
    integration: FastAPI, WebSocket, SQLite restore, HTTP contracts
    e2e: Longer product paths (thesis Case A/B both tenants, market-day)
addopts = -q
